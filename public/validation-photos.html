<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Photographies Studio - Cuvées Drinkcider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0e;
      --card-bg: rgba(18, 22, 28, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(52, 211, 153, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.25);
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Header Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 11, 14, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #059669, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .stat-pill {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-color: var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    /* Filter Tabs */
    .controls-container {
      max-width: 1440px;
      margin: 24px auto 0;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 24px auto;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Cuvée Card */
    .cuvee-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .cuvee-card:hover {
      border-color: var(--card-hover-border);
    }

    .cuvee-card.is-validated {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(18, 26, 23, 0.7);
    }

    .cuvee-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
      gap: 12px;
    }

    .cuvee-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cuvee-art-badge {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .cuvee-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .cuvee-slug {
      font-size: 13px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .cuvee-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .validate-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .validate-toggle.validated {
      background: #10b981;
      color: #042f2e;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }

    .validate-toggle.pending {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border-color: var(--card-border);
    }

    .validate-toggle.pending:hover {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* 3 Images Grid */
    .images-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .images-grid {
        grid-template-columns: 1fr;
      }
    }

    .photo-slot {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .photo-slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-slot-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #e5e7eb;
    }

    .photo-slot-spec {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .photo-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-ok {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-warn {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-info {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .photo-preview-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #111419;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .photo-preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .photo-preview-wrap:hover img {
      transform: scale(1.03);
    }

    .zoom-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.2s;
    }

    .photo-preview-wrap:hover .zoom-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .raw-thumb-compare {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .raw-thumb-compare img {
      width: 32px;
      height: 42px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .view-raw-link {
      color: #6ee7b7;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
    }

    .view-raw-link:hover {
      text-decoration: underline;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
      background: #111419;
    }

    .lightbox-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 20px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .lightbox-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .lightbox-close {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lightbox-close:hover {
      background: rgba(239, 68, 68, 0.8);
      transform: scale(1.1);
    }
  </style>
</head>

    <div class="stats-bar">

    <div class="header-actions">
      <button class="btn btn-secondary" onclick="validateAll()">Tout valider</button>
      <button class="btn btn-primary" onclick="exportValidationReport()">Sauvegarder & Exporter rapport</button>

  <div class="controls-container">

    <div style="font-size: 13px; color: var(--text-muted);">

  </div>

  <!-- Lightbox Modal -->

        "duoRaw": "PXL_20261001_094735590.RAW-01.jpg",
        "frontRaw": "PXL_20261001_094750351.RAW-01.jpg",
        "backRaw": "PXL_20261001_094807896.RAW-01.jpg",
        "needsFront": true,
        "needsBack": true
      }
    ];

    let validations = JSON.parse(localStorage.getItem('drinkcider_validations') || '{}');
    let currentFilter = 'all';

    function render() {
      const container = document.getElementById('cuveesList');
      container.innerHTML = '';

      let validatedCount = 0;
      const CACHE_BUST = '?v=1255';

      CUVEES.forEach(c => {
        const isValidated = !!validations[c.slug];
        if (isValidated) validatedCount++;

        if (currentFilter === 'validated' && !isValidated) return;
        if (currentFilter === 'pending' && isValidated) return;

        const card = document.createElement('div');
        card.className = `cuvee-card ${isValidated ? 'is-validated' : ''}`;
        card.id = `card-${c.slug}`;

        const duoPhoto = c.duoRaw ? `photo-bouteilles-raw/${c.duoRaw}` : null;
        const frontPhoto = c.frontRaw ? `photo-bouteilles-raw/${c.frontRaw}` : null;
        const backPhoto = c.backRaw ? `photo-bouteilles-raw/${c.backRaw}` : null;

        card.innerHTML = `
          <div class="cuvee-header">
            <div class="cuvee-title-group">
              <span class="cuvee-art-badge">Art. #${c.art}</span>
              <div>
                <h2 class="cuvee-title">${c.name}</h2>
                <span class="cuvee-slug">${c.category} • ${c.slug}</span>
              </div>
            </div>
            <div class="cuvee-actions">
              <button 
                class="validate-toggle ${isValidated ? 'validated' : 'pending'}" 
                onclick="toggleValidate('${c.slug}')"
              >
                ${isValidated ? '✓ Validé' : '○ Cliquer pour valider'}
              </button>
            </div>
          </div>

          <div class="images-grid">
            <!-- Photo 1: Duo (Deux Bouteilles) -->
            <div class="photo-slot">
              <div class="photo-slot-header">
                <span class="photo-slot-title">Photo 1 • Deux Bouteilles</span>
                ${duoPhoto ? 
                  '<span class="photo-status-badge badge-ok">✓ Photo brute authentique</span>' : 
                  '<span class="photo-status-badge badge-info">🏷️ Étiquette panoramique (pas de duo)</span>'
                }
              </div>
              ${duoPhoto ? `
                <div class="photo-preview-wrap" onclick="openLightbox('${duoPhoto}', '${c.name} — Photo 1 (Deux bouteilles)')">
                  <img src="${duoPhoto}" alt="${c.name} duo" loading="lazy">
                  <div class="zoom-hint">🔍 Agrandir</div>
                </div>
                <div style="font-size:11px; color:#9ca3af; font-family:monospace; margin-top:6px;">${c.duoRaw}</div>
              ` : `
                <div class="photo-preview-wrap" style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#9ca3af; text-align:center; padding:20px;">
                  <span style="font-size:28px;">🍾</span>
                  <span style="font-size:13px; font-weight:700; color:#e5e7eb;">Pas d'étiquette au dos</span>
                  <span style="font-size:12px; color:#9ca3af; line-height: 1.4;">Cette bouteille fine comporte une étiquette panoramique unique.</span>
                </div>
              `}
            </div>

            <!-- Photo 2: Bouteille Seule (Face) -->
            <div class="photo-slot">
              <div class="photo-slot-header">
                <span class="photo-slot-title">Photo 2 • Face</span>
                ${frontPhoto ? 
                  '<span class="photo-status-badge badge-ok">✓ Photo brute authentique</span>' : 
                  '<span class="photo-status-badge badge-info">-</span>'
                }
              </div>
              ${frontPhoto ? `
                <div class="photo-preview-wrap" onclick="openLightbox('${frontPhoto}', '${c.name} — Photo 2 (Face)')">
                  <img src="${frontPhoto}" alt="${c.name} face" loading="lazy">
                  <div class="zoom-hint">🔍 Agrandir</div>
                </div>
                <div style="font-size:11px; color:#9ca3af; font-family:monospace; margin-top:6px;">${c.frontRaw}</div>
              ` : `
                <div class="photo-preview-wrap" style="display:flex; align-items:center; justify-content:center; padding:20px; color:#9ca3af;">
                  <span>Aucune photo</span>
                </div>
              `}
            </div>

            <!-- Photo 3: Bouteille Seule (Dos) -->
            <div class="photo-slot">
              <div class="photo-slot-header">
                <span class="photo-slot-title">Photo 3 • Dos</span>
                ${backPhoto ? 
                  '<span class="photo-status-badge badge-ok">✓ Photo brute authentique</span>' : 
                  '<span class="photo-status-badge badge-info">🏷️ Étiquette panoramique</span>'
                }
              </div>
              ${backPhoto ? `
                <div class="photo-preview-wrap" onclick="openLightbox('${backPhoto}', '${c.name} — Photo 3 (Dos)')">
                  <img src="${backPhoto}" alt="${c.name} dos" loading="lazy">
                  <div class="zoom-hint">🔍 Agrandir</div>
                </div>
                <div style="font-size:11px; color:#9ca3af; font-family:monospace; margin-top:6px;">${c.backRaw}</div>
              ` : `
                <div class="photo-preview-wrap" style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#9ca3af; text-align:center; padding:20px;">
                  <span style="font-size:28px;">🍾</span>
                  <span style="font-size:13px; font-weight:700; color:#e5e7eb;">Étiquette panoramique unique</span>
                  <span style="font-size:12px; color:#9ca3af; line-height: 1.4;">Cette bouteille comporte une seule étiquette panoramique.</span>
                </div>
              `}
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('progressPill').innerText = `${validatedCount} / ${CUVEES.length} validées`;
      document.getElementById('validatedCount').innerText = validatedCount;
      document.getElementById('pendingCount').innerText = CUVEES.length - validatedCount;
    }

    function toggleValidate(slug) {
      if (validations[slug]) {
        delete validations[slug];
      } else {
        validations[slug] = { timestamp: new Date().toISOString() };
      }
      localStorage.setItem('drinkcider_validations', JSON.stringify(validations));
      render();
    }

    function validateAll() {
      CUVEES.forEach(c => {
        validations[c.slug] = { timestamp: new Date().toISOString() };
      });
      localStorage.setItem('drinkcider_validations', JSON.stringify(validations));
      render();
    }

    function filterCuvees(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function openLightbox(src, title) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxTitle').innerText = title;
      document.getElementById('lightboxDownload').href = src;
      document.getElementById('lightboxModal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    function exportValidationReport() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(validations, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "validation_drinkcider_photos.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      alert("Rapport de validation exporté avec succès !");
    }

    render();
  </script>
</body>
</html>
