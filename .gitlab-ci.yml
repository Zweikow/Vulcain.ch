variables:
  ACTION:
    value: "none"
    options:
      - "none"
      - "stop_rds"
      - "start_rds"
      - "status_rds"
      - "snapshot_rds"
      - "teardown_sandbox"
      - "migrate_dev"
    description: "Action FinOps / Maintenance manuelle à exécuter (laisser 'none' pour un pipeline normal)"

stages:
  - test
  - deploy
  - verify
  - finops

# ==============================================================================
# 1. STAGE TEST (QUALITÉ & DEVSECOPS)
# ==============================================================================

# Validation systématique (TypeScript, Prisma, Tests & Build Next.js)
validate:
  stage: test
  image: node:20
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "sandbox"'
    - if: '$CI_COMMIT_BRANCH =~ /^renovate\//'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
  script:
    - echo "Validation du code et des dépendances..."
    - npm ci
    - npx prisma generate
    - npx tsc --noEmit
    - npm test
    - npm run build

# Audit de sécurité des dépendances (DevSecOps)
security_audit:
  stage: test
  image: node:20
  allow_failure: true
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "sandbox"'
  script:
    - echo "Audit de sécurité des dépendances npm..."
    - npm audit --audit-level=high || true

# ==============================================================================
# 2. STAGE DEPLOY (DÉPLOIEMENT AWS SST)
# ==============================================================================

# Déploiement automatique sur l'environnement Dev
deploy_dev:
  stage: deploy
  image: node:20
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - 'if [ -z "$DATABASE_URL" ]; then echo "ERREUR : DATABASE_URL est obligatoire pour le déploiement mais elle est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_ENABLED" = "true" ] && { [ -z "$PFC_SPACE_ID" ] || [ -z "$PFC_USER_ID" ] || [ -z "$PFC_AUTH_KEY" ]; }; then echo "ERREUR : PFC_ENABLED vaut true mais PFC_SPACE_ID, PFC_USER_ID ou PFC_AUTH_KEY est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_MODE_CHOICE_ENABLED" = "true" ] && [ -z "$PFC_PAYMENT_MODES" ]; then echo "ERREUR : PFC_MODE_CHOICE_ENABLED vaut true mais PFC_PAYMENT_MODES est absente ou vide." >&2; exit 1; fi'
    - echo "Déploiement automatique sur AWS (Dev) en cours..."
    - export NEXT_PUBLIC_COMMIT_SHA=$CI_COMMIT_SHORT_SHA
    - npm ci
    - npx prisma generate
    - npx sst deploy --stage dev
  environment:
    name: dev
    url: https://dev.drinkcider.ch

# Déploiement automatique sur l'environnement Sandbox
deploy_sandbox:
  stage: deploy
  image: node:20
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "sandbox"'
  script:
    - 'if [ -z "$DATABASE_URL" ]; then echo "ERREUR : DATABASE_URL est obligatoire pour le déploiement mais elle est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_ENABLED" = "true" ] && { [ -z "$PFC_SPACE_ID" ] || [ -z "$PFC_USER_ID" ] || [ -z "$PFC_AUTH_KEY" ]; }; then echo "ERREUR : PFC_ENABLED vaut true mais PFC_SPACE_ID, PFC_USER_ID ou PFC_AUTH_KEY est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_MODE_CHOICE_ENABLED" = "true" ] && [ -z "$PFC_PAYMENT_MODES" ]; then echo "ERREUR : PFC_MODE_CHOICE_ENABLED vaut true mais PFC_PAYMENT_MODES est absente ou vide." >&2; exit 1; fi'
    - echo "Déploiement automatique sur AWS (Sandbox) en cours..."
    - export NEXT_PUBLIC_COMMIT_SHA=$CI_COMMIT_SHORT_SHA
    - npm ci
    - npx prisma generate
    - npx sst deploy --stage sandbox
  environment:
    name: sandbox
    url: https://sandbox.drinkcider.ch
    on_stop: sandbox:teardown

# Déploiement contrôlé sur l'environnement Production
deploy_production:
  stage: deploy
  image: node:20
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - 'if [ -z "$DATABASE_URL" ]; then echo "ERREUR : DATABASE_URL est obligatoire pour le déploiement mais elle est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_ENABLED" = "true" ] && { [ -z "$PFC_SPACE_ID" ] || [ -z "$PFC_USER_ID" ] || [ -z "$PFC_AUTH_KEY" ]; }; then echo "ERREUR : PFC_ENABLED vaut true mais PFC_SPACE_ID, PFC_USER_ID ou PFC_AUTH_KEY est absente ou vide." >&2; exit 1; fi'
    - 'if [ "$PFC_MODE_CHOICE_ENABLED" = "true" ] && [ -z "$PFC_PAYMENT_MODES" ]; then echo "ERREUR : PFC_MODE_CHOICE_ENABLED vaut true mais PFC_PAYMENT_MODES est absente ou vide." >&2; exit 1; fi'
    - echo "Déploiement manuel sur AWS (Production) en cours..."
    - export NEXT_PUBLIC_COMMIT_SHA=$CI_COMMIT_SHORT_SHA
    - npm ci
    - npx prisma generate
    - npx sst deploy --stage production
  environment:
    name: production
    url: https://drinkcider.ch

# ==============================================================================
# 3. STAGE VERIFY (SMOKE TESTS POST-DÉPLOIEMENT)
# ==============================================================================

verify_dev:
  stage: verify
  image: curlimages/curl:latest
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - echo "Vérification post-déploiement de Dev (Smoke test)..."
    - sleep 5
    - echo "Test 1 - Vérification HTTP & version déployée :"
    - curl -f -s https://dev.drinkcider.ch/api/version
    - echo ""
    - echo "Test 2 - Healthcheck applicatif & connectivité PostgreSQL :"
    - curl -s https://dev.drinkcider.ch/api/health || true
    - echo ""

verify_sandbox:
  stage: verify
  image: curlimages/curl:latest
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "sandbox"'
  script:
    - echo "Vérification post-déploiement de Sandbox (Smoke test)..."
    - sleep 5
    - echo "Test 1 - Vérification HTTP & version déployée :"
    - curl -f -s https://sandbox.drinkcider.ch/api/version
    - echo ""
    - echo "Test 2 - Healthcheck applicatif & connectivité PostgreSQL :"
    - curl -s https://sandbox.drinkcider.ch/api/health || true
    - echo ""

verify_production:
  stage: verify
  image: curlimages/curl:latest
  rules:
    - if: '$ACTION != null && $ACTION != "none"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Vérification post-déploiement de Production (Smoke test)..."
    - sleep 5
    - echo "Test 1 - Vérification HTTP & version déployée :"
    - curl -f -s https://drinkcider.ch/api/version
    - echo ""
    - echo "Test 2 - Healthcheck applicatif & connectivité PostgreSQL :"
    - curl -s https://drinkcider.ch/api/health || true
    - echo ""

# ==============================================================================
# 4. STAGE FINOPS (PILOTAGE CLOUD & GESTION DES COÛTS)
# ==============================================================================

# 1. Éteindre l'instance RDS PostgreSQL (Économie immédiate de ~14$/mois)
# Attention : cette instance porte aussi la base de production, que l'arrêt coupe.
# Lancement seulement par un pipeline avec ACTION = stop_rds, et non plus par un
# bouton des pipelines de develop ou de sandbox.
rds:stop:
  stage: finops
  image: amazon/aws-cli:latest
  rules:
    - if: '$ACTION == "stop_rds"'
      when: on_success
  script:
    - echo "Arrêt de l'instance RDS vulcain-db-dev, base de production comprise..."
    - aws rds stop-db-instance --db-instance-identifier vulcain-db-dev --region eu-central-2
    - echo "Demande d'arrêt envoyée avec succès."

# 2. Démarrer l'instance RDS PostgreSQL
# Même instance que la production : lancement seulement par ACTION = start_rds.
rds:start:
  stage: finops
  image: amazon/aws-cli:latest
  rules:
    - if: '$ACTION == "start_rds"'
      when: on_success
  script:
    - echo "Démarrage de l'instance RDS vulcain-db-dev..."
    - aws rds start-db-instance --db-instance-identifier vulcain-db-dev --region eu-central-2
    - echo "Demande de démarrage envoyée avec succès."

# 3. Vérifier le statut de l'instance RDS
rds:status:
  stage: finops
  image: amazon/aws-cli:latest
  rules:
    - if: '$ACTION == "status_rds"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "sandbox"'
      when: manual
      allow_failure: true
  script:
    - echo "Statut actuel de l'instance RDS :"
    - aws rds describe-db-instances --db-instance-identifier vulcain-db-dev --region eu-central-2 --query "DBInstances[0].[DBInstanceIdentifier,DBInstanceStatus,DBInstanceClass,Endpoint.Address]" --output table

# 4. Créer un snapshot de sauvegarde RDS à la demande
rds:snapshot:
  stage: finops
  image: amazon/aws-cli:latest
  rules:
    - if: '$ACTION == "snapshot_rds"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "sandbox"'
      when: manual
      allow_failure: true
  script:
    - export SNAPSHOT_ID="vulcain-manual-$(date +%Y%m%d-%H%M%S)"
    - echo "Création du snapshot manuel - $SNAPSHOT_ID..."
    - aws rds create-db-snapshot --db-instance-identifier vulcain-db-dev --db-snapshot-identifier $SNAPSHOT_ID --region eu-central-2
    - echo "Snapshot $SNAPSHOT_ID initié avec succès."

# 5. Détruire complètement l'infrastructure Sandbox sur AWS (SST remove)
sandbox:teardown:
  stage: finops
  image: node:20
  rules:
    - if: '$ACTION == "teardown_sandbox"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "sandbox"'
      when: manual
      allow_failure: true
  environment:
    name: sandbox
    action: stop
  script:
    - echo "Nettoyage de l'infrastructure Sandbox sur AWS..."
    - npm ci
    - npx sst remove --stage sandbox

# 6. Appliquer les migrations Prisma à la base de dev et sandbox, avec la
# DATABASE_URL de l'environnement dev : personne n'a besoin de la connaître.
# À lancer depuis la branche qui porte les migrations. La base de production
# est refusée : elle se migre à la main, après une sauvegarde.
db:migrate:dev:
  stage: finops
  image: node:20
  rules:
    - if: '$ACTION == "migrate_dev"'
      when: on_success
  environment:
    name: dev
    action: prepare
  script:
    - 'if [ -z "$DATABASE_URL" ]; then echo "ERREUR : DATABASE_URL est absente ou vide pour dev." >&2; exit 1; fi'
    - 'DB_NAME=$(node -e "console.log(decodeURIComponent(new URL(process.env.DATABASE_URL).pathname.slice(1)))")'
    - 'if [ "$DB_NAME" = "vulcain" ]; then echo "REFUS : vulcain est la base de production, qui se migre à la main." >&2; exit 1; fi'
    - echo "Migrations Prisma sur la base $DB_NAME (environnement dev)..."
    - npm ci
    - npx prisma migrate deploy
    - npx prisma migrate status

